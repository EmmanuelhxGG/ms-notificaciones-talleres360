server:
  port: ${SERVER_PORT:8084}
  error:
    include-message: never
    include-stacktrace: never
management:
  health:
    mail:
      enabled: ${SMTP_ENABLED:false}
    rabbit:
      enabled: ${RABBIT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
spring:
  flyway:
    enabled: false
  application:
    name: ms-talleres360-notify
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    default-encoding: UTF-8
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672}
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:}
    password: ${RABBIT_PASSWORD:}
    virtual-host: ${RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        auto-startup: ${RABBIT_ENABLED:false}
        default-requeue-rejected: false
        retry:
          enabled: false
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
app:
  internal-key: ${INTERNAL_API_KEY:}
  smtp:
    enabled: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:}
  rabbit:
    enabled: ${RABBIT_ENABLED:false}
    dlq-auto-startup: ${RABBIT_DLQ_AUTO_STARTUP:false}
    intentos: ${RABBIT_RETRY_ATTEMPTS:3}
    espera-ms: ${RABBIT_RETRY_WAIT_MS:1000}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:notifydb;DB_CLOSE_DELAY=-1
    username: sa
    password:
---
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/postgresql
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
