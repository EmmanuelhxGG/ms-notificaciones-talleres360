name: talleres360-notificaciones
services:
  notificaciones:
    build: .
    image: talleres360/ms-notificaciones:local
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
      TZ: America/Santiago
      SPRING_FLYWAY_TABLE: ${DB_MIGRATIONS_TABLE:-historial_migraciones_notificaciones}
      DB_URL: ${DB_URL:?Configura la URL de la base compartida talleres360}
      DB_USERNAME: ${DB_USERNAME:?Configura DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Configura INTERNAL_API_KEY}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      RABBIT_ENABLED: ${RABBIT_ENABLED:-false}
      RABBIT_DLQ_AUTO_STARTUP: ${RABBIT_DLQ_AUTO_STARTUP:-false}
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:-localhost:5672}
      RABBIT_HOST: ${RABBIT_HOST:-localhost}
      RABBIT_PORT: ${RABBIT_PORT:-5672}
      RABBIT_USERNAME: ${RABBIT_USERNAME:-}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-}
      RABBIT_VHOST: ${RABBIT_VHOST:-/}
    mem_limit: 512m
    restart: unless-stopped
